name: Deploy protected GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned build dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Verify financial calculations and password protection
        run: npm test
      - name: Encrypt site (fails closed without password)
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - name: Upload encrypted output only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
