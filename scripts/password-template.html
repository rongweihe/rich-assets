<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Rich Assets Book · 解锁手账</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#282d29;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}
    main{width:100%;max-width:390px}.brand{display:flex;align-items:center;gap:13px;font-size:22px;font-weight:500;letter-spacing:-.4px}.mark{display:grid;place-items:center;background:#47624f;color:#fffefa;width:39px;height:45px;font-family:Georgia,serif;font-size:28px;border-radius:2px}
    .eyebrow{font-size:10px;color:#7b8078;letter-spacing:2px;margin:44px 0 15px}h1{font-family:'Songti SC',serif;font-weight:400;font-size:29px;letter-spacing:1px;margin:0 0 13px}.intro{font-size:13px;color:#7b8078;line-height:1.8;margin:0 0 30px}
    label{display:block;font-size:12px;margin-bottom:9px}input{width:100%;font:16px inherit;border:1px solid #dfe2d8;border-radius:4px;padding:13px;background:#fffefa;color:#282d29;font-size:16px}input:focus{outline:2px solid #8ca58f;outline-offset:1px}button{width:100%;padding:13px;background:#47624f;color:#fffefa;border:0;border-radius:4px;font-size:13px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button:focus-visible{outline:2px solid #8ca58f;outline-offset:3px}
    #error{font-size:12px;color:#af6553;min-height:20px;margin:12px 0;line-height:1.7}.foot{border-top:1px solid #e5e5dc;margin-top:35px;padding-top:20px;font-size:11px;line-height:1.9;color:#93988e}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">R</span><span>Rich Assets Book</span></div>
    <p class="eyebrow">A SPACE OF YOUR OWN</p>
    <h1>把时间，留给价值。</h1>
    <p class="intro">输入访问密码，翻开你的投资手账。</p>
    <form id="unlock-form">
      <label for="site-password">网站访问密码</label>
      <input id="site-password" name="password" type="password" autocomplete="current-password" required maxlength="256" autofocus>
      <div id="error" role="alert" aria-live="polite"></div>
      <button id="unlock-button" type="submit">解锁手账 →</button>
    </form>
    <div class="foot">记录判断，也记录成长。<br>刷新或重新打开页面，需要再次解锁。</div>
    <noscript><p>请启用 JavaScript，以在浏览器中解密手账。</p></noscript>
  </main>
  <script>
    const staticryptInitiator = /*[|js_staticrypt|]*/0;
    const staticryptConfig = /*[|staticrypt_config|]*/0;
    const staticrypt = staticryptInitiator.init(staticryptConfig, {
      rememberExpirationKey: 'rich-assets-gate-expiration',
      rememberPassphraseKey: 'rich-assets-gate-passphrase',
      replaceHtmlCallback: null,
      clearLocalStorageCallback: null,
    });
    // 解锁只调用认证解密；不读取记住密码、不接受 URL 自动解锁、不保存访问口令。
    document.getElementById('unlock-form').addEventListener('submit', async event => {
      event.preventDefault();
      const input = document.getElementById('site-password');
      const button = document.getElementById('unlock-button');
      const error = document.getElementById('error');
      button.disabled = true;
      error.textContent = '';
      try {
        if (!window.isSecureContext || !crypto.subtle) throw new Error('secure-context');
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(input.value, false);
        if (!isSuccessful) {
          error.textContent = '密码不正确，请重新输入。';
          input.value = '';
          input.focus();
        }
      } catch (cause) {
        error.textContent = cause.message === 'secure-context'
          ? '请通过 HTTPS 或 localhost 打开手账。'
          : '无法解锁，请刷新页面后重试。';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
